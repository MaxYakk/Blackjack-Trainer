name: BlackjackTrainer
options:
  bundleIdPrefix: com.maxyatkeman
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  BlackjackTrainer:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxyatkeman.blackjacktrainer
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Blackjack"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations__ipad_: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  BlackjackTrainerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: BlackjackTrainer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxyatkeman.blackjacktrainer.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BlackjackTrainer
schemes:
  BlackjackTrainer:
    build:
      targets:
        BlackjackTrainer: all
        BlackjackTrainerUITests: [test]
    test:
      targets:
        - BlackjackTrainerUITests
